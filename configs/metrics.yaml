version: 1

selection:
  forms:
    - 10-K
    - 10-K/A
  duration_days:
    min: 350
    max: 380
  period_fields:
    - start
    - end
  within_tag: latest_filed
  across_tags: first_available

metrics:
  revenue:
    description: Annual total revenue
    taxonomy: us-gaap
    unit: USD
    tags:
      - RevenueFromContractWithCustomerExcludingAssessedTax
      - Revenues
      - SalesRevenueNet
  net_income:
    description: Net Income
    taxonomy: us-gaap
    unit: USD
    tags: 
      - NetIncomeLoss
  operating_income:
    description: Operating Income
    taxonomy: us-gaap
    unit: USD
    tags: 
      - OperatingIncomeLoss

calculations:
  net_margin:
    description: Annual net profit margin
    function: calculate_margin
    inputs:
      - net_income
      - revenue
    unit: ratio
    period_mode: same_period

  operating_margin:
    description: Annual operating profit margin
    function: calculate_margin
    inputs:
      - operating_income
      - revenue
    unit: ratio
    period_mode: same_period

  revenue_growth:
    description: Annual revenue growth
    function: calculate_growth
    inputs:
      - revenue
    unit: ratio
    period_mode: consecutive_periods

  revenue_cagr:
    description: Compound annual revenue growth rate
    function: calculate_cagr
    inputs:
      - revenue
    unit: ratio
    period_mode: full_range