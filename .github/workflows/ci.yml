name: FinSight CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the tested image to GHCR (default branch only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: finsight-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend JavaScript syntax
        run: node --check src/static/research.js
      - name: Validate Compose without real credentials
        env:
          SEC_USER_AGENT: FinSight CI ci@invalid.test
          OPENAI_API_KEY: ci-placeholder-not-a-real-key
        run: docker compose config --quiet

  image:
    name: Docker build and startup check
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: finsight:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check container startup without model calls
        run: |
          docker run --detach --init --name finsight-ci \
            --publish 127.0.0.1:8766:8766 finsight:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' finsight-ci)
            if [ "$status" = healthy ]; then
              curl --fail --silent http://127.0.0.1:8766/api/research
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' finsight-ci)" != true ]; then
              break
            fi
            sleep 2
          done
          echo 'Container did not become healthy within 60 seconds.'
          exit 1
      - name: Print container logs on failure
        if: failure()
        run: docker logs finsight-ci || true
      - name: Remove test container
        if: always()
        run: docker rm --force finsight-ci || true

  publish:
    name: Publish tested image to GHCR
    needs: image
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_image &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase registry image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
